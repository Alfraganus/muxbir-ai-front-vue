<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1440" />
  <title>Muxbir AI — Console</title>
  <!-- Telegram Mini App: launch parametrlari (#tgWebAppData=...) hash-router yo'lini
       buzadi. Bu inline script modul bundle (va vue-router) yuklanishidan OLDIN
       ishlaydi — Telegram ichida bo'lsa hash'ni /support ga to'g'rilaymiz. -->
  <script>
    (function () {
      try {
        var h = window.location.hash || '';
        var inTelegram = h.indexOf('tgWebApp') !== -1 ||
          !!(window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData);
        if (inTelegram && h.indexOf('#/support') !== 0) {
          window.history.replaceState(null, '',
            window.location.pathname + window.location.search + '#/support');
        }
      } catch (e) { /* ignore */ }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
